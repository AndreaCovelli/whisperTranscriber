name: Dependency Submission

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.set-output.outputs.should_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect dependency-related changes on PR open
        id: filter_pr_open
        if: github.event_name == 'pull_request' && github.event.action != 'synchronize'
        uses: tj-actions/changed-files@v47
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}
          sha: ${{ github.event.pull_request.head.sha }}
          files: |
            app/**
            gradle/**
            *.kts
            gradle.properties
            .editorconfig
            gradlew*
            .github/workflows/dependency-submission.yml

      - name: Detect dependency-related changes on PR update
        id: filter_pr_sync
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        uses: tj-actions/changed-files@v47
        with:
          since_last_remote_commit: true
          files: |
            app/**
            gradle/**
            *.kts
            gradle.properties
            .editorconfig
            gradlew*
            .github/workflows/dependency-submission.yml

      - name: Detect dependency-related changes on push
        id: filter_push
        if: github.event_name == 'push'
        uses: tj-actions/changed-files@v47
        with:
          since_last_remote_commit: true
          files: |
            app/**
            gradle/**
            *.kts
            gradle.properties
            .editorconfig
            gradlew*
            .github/workflows/dependency-submission.yml

      - name: Consolidate change detection result
        id: set-output
        env:
          PR_OPEN_CHANGED: ${{ steps.filter_pr_open.outputs.any_changed }}
          PR_SYNC_CHANGED: ${{ steps.filter_pr_sync.outputs.any_changed }}
          PUSH_CHANGED: ${{ steps.filter_push.outputs.any_changed }}
        run: |
          SHOULD_RUN=false
          if [[ "$PR_OPEN_CHANGED" == "true" || "$PR_SYNC_CHANGED" == "true" || "$PUSH_CHANGED" == "true" ]]; then
            SHOULD_RUN=true
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

  dependency-submission:
    name: Submit Gradle dependency graph
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
