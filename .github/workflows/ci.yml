name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          add-job-summary: "on-failure"

      - name: Run quality checks
        run: ./gradlew spotlessCheck detekt lintDebug --console=plain

  build-unit:
    name: Build & Unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          add-job-summary: "on-failure"

      - name: Build debug APK and run JVM tests
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain

  instrumentation:
    name: Instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          add-job-summary: "on-failure"

      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm

      - name: Verify emulator acceleration
        run: |
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Run managed-device tests
        run: >-
          ./gradlew pixel6Api34DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --console=plain

      - name: Upload instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: warn

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan full history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          add-job-summary: "on-failure"

      - name: Generate release runtime CycloneDX SBOM
        run: ./gradlew :app:cyclonedxDirectBom --console=plain

      - name: Report release runtime SBOM vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          # The SBOM input is mutually exclusive with a workspace path scan.
          sbom: app/build/reports/cyclonedx-release/bom.json
          output-format: table
          severity-cutoff: negligible
          only-fixed: false
          fail-build: false

      - name: Gate fixed high and critical release runtime vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          # Keep Grype scoped to the release runtime dependency graph.
          sbom: app/build/reports/cyclonedx-release/bom.json
          output-format: table
          severity-cutoff: high
          only-fixed: true
          fail-build: true

      - name: Upload release SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-runtime-sbom
          path: app/build/reports/cyclonedx-release/bom.json
          if-no-files-found: error

  ci-gate:
    name: CI Gate
    if: always()
    needs: [quality, build-unit, instrumentation, security]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_UNIT_RESULT: ${{ needs.build-unit.result }}
          INSTRUMENTATION_RESULT: ${{ needs.instrumentation.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$BUILD_UNIT_RESULT" = "success"
          test "$INSTRUMENTATION_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"

  legacy-gate:
    name: Build, Test and Auto-merge
    if: always()
    needs: [ci-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the existing required check during ruleset migration
        env:
          CI_GATE_RESULT: ${{ needs.ci-gate.result }}
        run: test "$CI_GATE_RESULT" = "success"
