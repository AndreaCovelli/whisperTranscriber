name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: self-hosted
    outputs:
      should_run: ${{ steps.set-output.outputs.should_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect code and build changes on PR open
        id: filter_pr_open
        if: github.event_name == 'pull_request' && github.event.action != 'synchronize'
        uses: tj-actions/changed-files@v47
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}
          sha: ${{ github.event.pull_request.head.sha }}
          files: |
            app/**
            gradle/**
            *.kts
            .editorconfig
            config/detekt/**
            gradlew*
            .github/workflows/ci.yml

      - name: Detect code and build changes on PR update
        id: filter_pr_sync
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        uses: tj-actions/changed-files@v47
        with:
          since_last_remote_commit: true
          files: |
            app/**
            gradle/**
            *.kts
            .editorconfig
            config/detekt/**
            gradlew*
            .github/workflows/ci.yml

      - name: Detect code and build changes on push
        id: filter_push
        if: github.event_name == 'push'
        uses: tj-actions/changed-files@v47
        with:
          since_last_remote_commit: true
          files: |
            app/**
            gradle/**
            *.kts
            .editorconfig
            config/detekt/**
            gradlew*
            .github/workflows/ci.yml

      - name: Consolidate change detection result
        id: set-output
        env:
          PR_OPEN_CHANGED: ${{ steps.filter_pr_open.outputs.any_changed }}
          PR_SYNC_CHANGED: ${{ steps.filter_pr_sync.outputs.any_changed }}
          PUSH_CHANGED: ${{ steps.filter_push.outputs.any_changed }}
        run: |
          SHOULD_RUN=false
          if [[ "$PR_OPEN_CHANGED" == "true" || "$PR_SYNC_CHANGED" == "true" || "$PUSH_CHANGED" == "true" ]]; then
            SHOULD_RUN=true
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      needs.changes.outputs.should_run == 'true'
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # remove this line when switching to Github-hosted runners
          cache-disabled: true
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          add-job-summary: "on-failure"

      - name: Run quality checks
        run: ./gradlew spotlessCheck detekt lintDebug --console=plain

  build:
    name: Build, Test and Auto-merge
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      needs.changes.outputs.should_run == 'true'
    runs-on: self-hosted
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # remove this line when switching to Github-hosted runners
          cache-disabled: true
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          add-job-summary: "on-failure"

      - name: Build and test with Gradle
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain

      - name: Dependabot metadata
        if: github.actor == 'dependabot[bot]'
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for Dependabot PRs
        if: github.actor == 'dependabot[bot]'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
