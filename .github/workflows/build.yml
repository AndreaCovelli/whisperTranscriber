name: CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build, Test and Auto-merge
    runs-on: ubuntu-latest
    # Added permissions to allow the auto-merge step to function
    permissions:
      pull-requests: write
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        # PRs only read from the cache; only the main branch writes to it
        # This prevents Dependabot and other PRs from polluting/filling the cache storage
        cache-read-only: true
        add-job-summary: 'on-failure'

    - name: Build and Test with Gradle
      # Run assemble and tests in a single command to reuse the configuration cache
      run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

    # The following steps only run for Dependabot Pull Requests
    - name: Dependabot metadata
      if: github.actor == 'dependabot[bot]'
      id: metadata
      uses: dependabot/fetch-metadata@v2
      with:
        github-token: "${{ secrets.GITHUB_TOKEN }}"

    - name: Enable auto-merge for Dependabot PRs
      if: github.actor == 'dependabot[bot]'
      run: gh pr merge --auto --squash "$PR_URL"
      env:
        PR_URL: ${{github.event.pull_request.html_url}}
        GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
