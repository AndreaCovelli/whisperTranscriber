name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-status:
    name: Reuse main CI
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    outputs:
      required: ${{ steps.ci.outputs.required }}
      skip-jobs: ${{ steps.ci.outputs.skip-jobs }}
      instrumentation-suites: ${{ steps.ci.outputs.instrumentation-suites }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require tag commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Wait for main CI and select missing checks
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/release_ci.py

  verify:
    name: Verify missing checks
    needs: ci-status
    if: ${{ needs.ci-status.outputs.required == 'true' }}
    uses: ./.github/workflows/ci.yml
    with:
      force: true
      skip-jobs: ${{ needs.ci-status.outputs.skip-jobs }}
      instrumentation-suites: ${{ needs.ci-status.outputs.instrumentation-suites }}
    permissions:
      contents: read
      pull-requests: read

  release:
    name: Publish signed APK
    needs: [ci-status, verify]
    if: >-
      ${{
        !cancelled() &&
        needs.ci-status.result == 'success' &&
        ((needs.ci-status.outputs.required == 'false' && needs.verify.result == 'skipped') ||
         (needs.ci-status.outputs.required == 'true' && needs.verify.result == 'success'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require tag commit on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Validate SemVer tag and derive version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          SEMVER='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$RELEASE_TAG" =~ $SEMVER ]]; then
            echo "Release tags must be v followed by a valid SemVer version."
            exit 1
          fi
          VERSION_NAME="${RELEASE_TAG#v}"
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          add-job-summary: "on-failure"

      - name: Require every signing secret
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_versionName: ${{ steps.version.outputs.name }}
          ORG_GRADLE_PROJECT_versionCode: ${{ steps.version.outputs.code }}
          ORG_GRADLE_PROJECT_keystorePath: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_keystorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: Reject unsigned or debug-signed APKs
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          CERTIFICATE=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTIFICATE"
          if echo "$CERTIFICATE" | grep -qi "CN=Android Debug"; then
            echo "Refusing to publish an APK signed with the Android debug certificate."
            exit 1
          fi

      - name: Rename release APK
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
        run: |
          mv "app/build/outputs/apk/release/app-release.apk" \
            "app/build/outputs/apk/release/WhisperTranscriber-$RELEASE_VERSION.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/WhisperTranscriber-${{ steps.version.outputs.name }}.apk

      - name: Remove signing material
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/release.jks"
