# Builds a signed release APK and publishes a GitHub Release.
#
# Trigger: push a tag matching v* (e.g. v1.2.3)
#   git tag v1.2.3 && git push origin v1.2.3
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_BASE64  — base64-encoded .jks keystore file
#                              Linux/macOS: base64 -w 0 your-release.jks
#                              PowerShell:  [Convert]::ToBase64String([IO.File]::ReadAllBytes('your-release.jks'))
#   KEYSTORE_PASSWORD        — keystore store password
#   KEY_ALIAS                — key alias inside the keystore
#   KEY_PASSWORD             — key password

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (full history for versionCode)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'

      - name: Extract version from tag
        id: version
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/release.jks"

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_versionName: ${{ steps.version.outputs.name }}
          ORG_GRADLE_PROJECT_versionCode: ${{ steps.version.outputs.code }}
          ORG_GRADLE_PROJECT_keystorePath: ${{ github.workspace }}/release.jks
          ORG_GRADLE_PROJECT_keystorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK with version
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/WhisperTranscriber-${{ steps.version.outputs.name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/WhisperTranscriber-${{ steps.version.outputs.name }}.apk
