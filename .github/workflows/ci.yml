name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
  workflow_call:
    inputs:
      force:
        description: Run all checks regardless of changed paths
        type: boolean
        default: false
      skip-jobs:
        description: JSON list of jobs already verified on the exact release commit
        type: string
        default: "[]"
      instrumentation-suites:
        description: JSON list of device suites still requiring verification
        type: string
        default: '["debug", "minifiedSmoke"]'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.changes.outputs.android }}
      instrumentation: ${{ steps.changes.outputs.instrumentation }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # paths-filter may need to fetch the pre-push commit after a history rewrite.
          persist-credentials: true

      - name: Test release CI selection
        run: python3 -B -m unittest discover --start-directory .github/scripts --pattern 'test_*.py' --verbose

      - name: Detect Android-relevant changes
        if: ${{ !inputs.force && github.event_name != 'workflow_dispatch' }}
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            android:
              - ".editorconfig"
              - ".github/workflows/**"
              - "app/**"
              - "build.gradle.kts"
              - "config/**"
              - "gradle/**"
              - "gradle.properties"
              - "gradlew"
              - "gradlew.bat"
              - "settings.gradle.kts"
            instrumentation:
              - ".github/workflows/ci.yml"
              - "app/build.gradle.kts"
              - "app/*.pro"
              - "app/schemas/**"
              - "app/src/androidTest/**"
              - "app/src/main/**"
              - "build.gradle.kts"
              - "gradle/**"
              - "gradle.properties"
              - "gradlew"
              - "gradlew.bat"
              - "settings.gradle.kts"

  quality:
    name: Quality
    needs: changes
    if: >-
      ${{
        !contains(fromJSON(inputs.skip-jobs || '[]'), 'quality') &&
        (inputs.force ||
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.android == 'true')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          add-job-summary: "on-failure"

      - name: Run quality checks
        run: ./gradlew spotlessCheck detekt lintDebug --console=plain

  build-unit:
    name: Build & Unit
    needs: changes
    if: >-
      ${{
        !contains(fromJSON(inputs.skip-jobs || '[]'), 'build-unit') &&
        (inputs.force ||
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.android == 'true')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          add-job-summary: "on-failure"

      - name: Build debug APK and run JVM tests
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain

  instrumentation:
    name: Instrumentation (${{ matrix.suite }})
    needs: changes
    if: >-
      ${{
        inputs.instrumentation-suites != '[]' &&
        (inputs.force ||
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.instrumentation == 'true')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.instrumentation-suites || '["debug", "minifiedSmoke"]') }}
    env:
      # Leave room for the Android emulator and runner on private-repository VMs.
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx1g"
        -Dorg.gradle.workers.max=2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          add-job-summary: "on-failure"

      - name: Reserve disk space for the API 34 managed device
        run: |
          if [[ -d /usr/local/lib/android/sdk/ndk ]]; then
            sudo du -sh /usr/local/lib/android/sdk/ndk
            sudo rm -rf /usr/local/lib/android/sdk/ndk
          fi
          df -h /

      - name: Restore API 34 ATD system image
        id: atd_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/aosp_atd/x86_64
          key: ${{ runner.os }}-android-atd-api34-aosp-x86_64-v1

      - name: Install Android emulator
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator"

      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm

      - name: Verify emulator acceleration
        run: |
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Prepare managed device
        id: prepare_managed_device
        timeout-minutes: 5
        run: >-
          ./gradlew pixel6Api34Setup
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --console=plain

      - name: Diagnose managed-device setup failure
        timeout-minutes: 5
        if: >-
          ${{
            failure() &&
            steps.prepare_managed_device.outcome == 'failure'
          }}
        run: >-
          ./gradlew pixel6Api34Setup
          -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --info
          --stacktrace
          --console=plain

      - name: Verify notification permission recreation
        if: ${{ matrix.suite == 'debug' }}
        timeout-minutes: 15
        run: >-
          ./gradlew pixel6Api34DebugAndroidTest --console=plain
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.testInstrumentationRunnerArguments.class=com.andreacovelli.whispertranscriber.NotificationPermissionRecreationInstrumentedTest

      - name: Run managed-device tests
        if: ${{ matrix.suite == 'debug' }}
        timeout-minutes: 10
        run: >-
          ./gradlew pixel6Api34DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --console=plain

      - name: Verify minified JSON exports
        if: ${{ matrix.suite == 'minifiedSmoke' }}
        timeout-minutes: 20
        run: >-
          ./gradlew pixel6Api34MinifiedSmokeAndroidTest --console=plain
          -PinstrumentationBuildType=minifiedSmoke
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.testInstrumentationRunnerArguments.class=com.andreacovelli.whispertranscriber.HistoryExportInstrumentedTest

      - name: Require minified export test results
        if: ${{ matrix.suite == 'minifiedSmoke' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = Path("app/build/outputs/androidTest-results/managedDevice/minifiedsmoke/pixel6Api34")
          cases = [case for report in reports.glob("TEST-*.xml")
                   for case in ET.parse(report).iter("testcase")
                   if case.get("classname", "").endswith(".HistoryExportInstrumentedTest")]
          if len(cases) < 4 or any(case.find(tag) is not None
                                   for case in cases for tag in ("failure", "error", "skipped")):
              raise SystemExit("All four minified export scenarios must execute and pass.")
          PY

      - name: Save API 34 ATD system image
        if: >-
          ${{
            success() &&
            matrix.suite == 'debug' &&
            github.event_name == 'push' &&
            steps.atd_cache.outputs.cache-hit != 'true'
          }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/aosp_atd/x86_64
          key: ${{ steps.atd_cache.outputs.cache-primary-key }}

      - name: Upload instrumentation reports on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-reports-${{ matrix.suite }}
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: warn

  security:
    name: Security
    needs: changes
    if: ${{ !contains(fromJSON(inputs.skip-jobs || '[]'), 'security') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan full history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Set up JDK 21
        if: >-
          ${{
            inputs.force ||
            github.event_name == 'workflow_dispatch' ||
            needs.changes.outputs.android == 'true'
          }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        if: >-
          ${{
            inputs.force ||
            github.event_name == 'workflow_dispatch' ||
            needs.changes.outputs.android == 'true'
          }}
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          add-job-summary: "on-failure"

      - name: Generate release runtime CycloneDX SBOM
        if: >-
          ${{
            inputs.force ||
            github.event_name == 'workflow_dispatch' ||
            needs.changes.outputs.android == 'true'
          }}
        run: ./gradlew :app:cyclonedxDirectBom --console=plain

      - name: Report release runtime SBOM vulnerabilities
        if: >-
          ${{
            inputs.force ||
            github.event_name == 'workflow_dispatch' ||
            needs.changes.outputs.android == 'true'
          }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          # The SBOM input is mutually exclusive with a workspace path scan.
          sbom: app/build/reports/cyclonedx-release/bom.json
          output-format: table
          severity-cutoff: negligible
          only-fixed: false
          fail-build: false

      - name: Gate fixed high and critical release runtime vulnerabilities
        if: >-
          ${{
            inputs.force ||
            github.event_name == 'workflow_dispatch' ||
            needs.changes.outputs.android == 'true'
          }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          # Keep Grype scoped to the release runtime dependency graph.
          sbom: app/build/reports/cyclonedx-release/bom.json
          output-format: table
          severity-cutoff: high
          only-fixed: true
          fail-build: true

      - name: Upload release SBOM
        if: >-
          ${{
            always() &&
            (inputs.force ||
            github.event_name == 'workflow_dispatch' ||
            needs.changes.outputs.android == 'true')
          }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-runtime-sbom
          path: app/build/reports/cyclonedx-release/bom.json
          if-no-files-found: error

  ci-gate:
    name: CI Gate
    if: always()
    needs: [changes, quality, build-unit, instrumentation, security]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable verification job
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_UNIT_RESULT: ${{ needs.build-unit.result }}
          INSTRUMENTATION_RESULT: ${{ needs.instrumentation.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SECURITY_REUSED: ${{ contains(fromJSON(inputs.skip-jobs || '[]'), 'security') }}
        run: |
          test "$CHANGES_RESULT" = "success"
          if [ "$SECURITY_RESULT" = "skipped" ]; then
            test "$SECURITY_REUSED" = "true"
          else
            test "$SECURITY_RESULT" = "success"
          fi
          for result in "$QUALITY_RESULT" "$BUILD_UNIT_RESULT" "$INSTRUMENTATION_RESULT"; do
            test "$result" = "success" || test "$result" = "skipped"
          done
