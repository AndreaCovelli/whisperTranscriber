name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          add-job-summary: "on-failure"

      - name: Run quality checks
        run: ./gradlew spotlessCheck detekt lintDebug --console=plain

  build-unit:
    name: Build & Unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          add-job-summary: "on-failure"

      - name: Build debug APK and run JVM tests
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain

  instrumentation:
    name: Instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether instrumentation is required
        id: instrumentation_scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" HEAD -- \
            .github/workflows/ci.yml \
            app/build.gradle.kts \
            app/schemas \
            app/src/androidTest \
            app/src/main \
            build.gradle.kts \
            gradle \
            gradle.properties \
            settings.gradle.kts
          then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip instrumentation for unrelated changes
        if: ${{ steps.instrumentation_scope.outputs.required != 'true' }}
        run: echo "No Android runtime, instrumentation, schema, or build inputs changed."

      - name: Set up JDK 21
        if: ${{ steps.instrumentation_scope.outputs.required == 'true' }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        if: ${{ steps.instrumentation_scope.outputs.required == 'true' }}
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          add-job-summary: "on-failure"

      - name: Reserve disk space for the API 34 managed device
        if: ${{ steps.instrumentation_scope.outputs.required == 'true' }}
        run: |
          if [[ -d /usr/local/lib/android/sdk/ndk ]]; then
            sudo du -sh /usr/local/lib/android/sdk/ndk
            sudo rm -rf /usr/local/lib/android/sdk/ndk
          fi
          df -h /

      - name: Restore API 34 ATD system image
        id: atd_cache
        if: ${{ steps.instrumentation_scope.outputs.required == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/aosp_atd/x86_64
          key: ${{ runner.os }}-android-atd-api34-aosp-x86_64-v1

      - name: Install Android emulator
        if: ${{ steps.instrumentation_scope.outputs.required == 'true' }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator"

      - name: Enable KVM access
        if: ${{ steps.instrumentation_scope.outputs.required == 'true' }}
        run: sudo chmod 666 /dev/kvm

      - name: Verify emulator acceleration
        if: ${{ steps.instrumentation_scope.outputs.required == 'true' }}
        run: |
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Prepare managed device
        id: prepare_managed_device
        if: ${{ steps.instrumentation_scope.outputs.required == 'true' }}
        run: >-
          ./gradlew pixel6Api34Setup
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --console=plain

      - name: Diagnose managed-device setup failure
        if: >-
          ${{
            failure() &&
            steps.instrumentation_scope.outputs.required == 'true' &&
            steps.prepare_managed_device.outcome == 'failure'
          }}
        run: >-
          ./gradlew pixel6Api34Setup
          -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --info
          --stacktrace
          --console=plain

      - name: Run managed-device tests
        if: ${{ steps.instrumentation_scope.outputs.required == 'true' }}
        run: >-
          ./gradlew pixel6Api34DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --console=plain

      - name: Save API 34 ATD system image
        if: >-
          ${{
            success() &&
            github.event_name == 'push' &&
            steps.instrumentation_scope.outputs.required == 'true' &&
            steps.atd_cache.outputs.cache-hit != 'true'
          }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/aosp_atd/x86_64
          key: ${{ steps.atd_cache.outputs.cache-primary-key }}

      - name: Upload instrumentation reports on failure
        if: ${{ failure() && steps.instrumentation_scope.outputs.required == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: warn

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan full history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          add-job-summary: "on-failure"

      - name: Generate release runtime CycloneDX SBOM
        run: ./gradlew :app:cyclonedxDirectBom --console=plain

      - name: Report release runtime SBOM vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          # The SBOM input is mutually exclusive with a workspace path scan.
          sbom: app/build/reports/cyclonedx-release/bom.json
          output-format: table
          severity-cutoff: negligible
          only-fixed: false
          fail-build: false

      - name: Gate fixed high and critical release runtime vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          # Keep Grype scoped to the release runtime dependency graph.
          sbom: app/build/reports/cyclonedx-release/bom.json
          output-format: table
          severity-cutoff: high
          only-fixed: true
          fail-build: true

      - name: Upload release SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-runtime-sbom
          path: app/build/reports/cyclonedx-release/bom.json
          if-no-files-found: error

  ci-gate:
    name: CI Gate
    if: always()
    needs: [quality, build-unit, instrumentation, security]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_UNIT_RESULT: ${{ needs.build-unit.result }}
          INSTRUMENTATION_RESULT: ${{ needs.instrumentation.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$BUILD_UNIT_RESULT" = "success"
          test "$INSTRUMENTATION_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"

  legacy-gate:
    name: Build, Test and Auto-merge
    if: always()
    needs: [ci-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the existing required check during ruleset migration
        env:
          CI_GATE_RESULT: ${{ needs.ci-gate.result }}
        run: test "$CI_GATE_RESULT" = "success"
