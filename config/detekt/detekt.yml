build:
  maxIssues: 0

config:
  validation: true

complexity:
  LongMethod:
    active: true
    threshold: 140
  CyclomaticComplexMethod:
    active: true
    threshold: 25
  ComplexCondition:
    active: true
    threshold: 6
  LongParameterList:
    active: true
    functionThreshold: 12
    constructorThreshold: 12
    ignoreDefaultParameters: true
  NestedBlockDepth:
    active: true
    threshold: 6
  TooManyFunctions:
    active: true
    thresholdInFiles: 30
    thresholdInClasses: 25
    thresholdInInterfaces: 25
    thresholdInObjects: 25
    thresholdInEnums: 25
    ignoreAnnotatedFunctions:
      - Composable

exceptions:
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - InterruptedException
      - NumberFormatException

naming:
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    ignoreAnnotated:
      - Composable
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'

potential-bugs:
  UnsafeCallOnNullableType:
    active: true

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: true
  MaxLineLength:
    active: false
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  ForbiddenComment:
    active: true
    comments:
      - value: 'TODO:'
        reason: 'Track TODOs in issues instead of leaving them in production code.'
      - value: 'FIXME:'
        reason: 'Track fixes in issues instead of leaving them in production code.'
