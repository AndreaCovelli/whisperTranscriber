name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
  # Weekly dependency scan: new advisories appear without any dependency file changing.
  schedule:
    - cron: "17 5 * * 1"
  workflow_call:
    inputs:
      force:
        description: Run all checks regardless of changed paths
        type: boolean
        default: false
      skip-jobs:
        description: JSON list of jobs already verified on the exact release commit
        type: string
        default: "[]"
      instrumentation-suites:
        description: JSON list of device suites still requiring verification
        type: string
        default: '["debug", "minifiedSmoke"]'

concurrency:
  # Every main commit needs its own completed run for path selection and release reuse, and
  # GitHub replaces a pending run in a shared group, so main pushes group per commit.
  group: ci-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.select.outputs.android }}
      instrumentation: ${{ steps.select.outputs.instrumentation }}
      suites: ${{ steps.select.outputs.suites }}
      validated: ${{ steps.select.outputs.validated }}
      sbom: ${{ steps.select.outputs.sbom }}
      workflows: ${{ steps.select.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Push comparisons need the previous commit without an authenticated fetch.
          fetch-depth: 0
          persist-credentials: false

      - name: Test release CI selection
        run: python3 -B -m unittest discover --start-directory .github/scripts --pattern 'test_*.py' --verbose

      # A force push discards the previous head, so there is nothing to compare against:
      # run every check, as for manual runs.
      - name: Detect Android-relevant changes
        if: >-
          ${{
            !inputs.force &&
            github.event_name != 'workflow_dispatch' &&
            github.event_name != 'schedule' &&
            !github.event.forced
          }}
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            android:
              - ".editorconfig"
              - ".github/workflows/ci.yml"
              - "app/**"
              - "build.gradle.kts"
              - "config/**"
              - "gradle/**"
              - "gradle.properties"
              - "gradlew"
              - "gradlew.bat"
              - "settings.gradle.kts"
            # CI edits do not run the emulators; run CI manually (workflow_dispatch) after
            # changing the emulator steps themselves.
            instrumentation:
              - "app/build.gradle.kts"
              - "app/*.pro"
              - "app/schemas/**"
              - "app/src/androidTest/**"
              - "app/src/main/**"
              - "build.gradle.kts"
              - "gradle/**"
              - "gradle.properties"
              - "gradlew"
              - "gradlew.bat"
              - "settings.gradle.kts"
            # The minified suite only covers history export under R8, so it needs the R8,
            # export, and build configuration inputs, not every UI change.
            minified:
              - "app/*.pro"
              - "app/build.gradle.kts"
              - "app/schemas/**"
              - "app/src/androidTest/export/**"
              - "app/src/main/AndroidManifest.xml"
              - "app/src/main/java/**/data/**"
              - "app/src/main/java/**/history/**"
              - "build.gradle.kts"
              - "gradle/**"
              - "gradle.properties"
              - "gradlew"
              - "gradlew.bat"
              - "settings.gradle.kts"
            # SBOM and Grype scans only change with the dependency graph.
            sbom:
              - "app/build.gradle.kts"
              - "build.gradle.kts"
              - "gradle/**"
              - "gradle.properties"
              - "settings.gradle.kts"
            workflows:
              - ".github/**"

      # A push that a pull request already validated needs no second emulator run, but the
      # debug leg still seeds the managed-device snapshot cache, which only main can save.
      - name: Look for an earlier validation
        id: earlier
        if: ${{ github.event_name == 'push' && !inputs.force && !github.event.forced }}
        uses: AndreaCovelli/repo-baseline/.github/actions/tree-validated@a9310352317e707bffc0e031caf29d3c48d7eb97 # v1.1.0

      - name: Select jobs to run
        id: select
        env:
          RUN_ALL: ${{ inputs.force || github.event_name == 'workflow_dispatch' || github.event.forced }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          ANDROID: ${{ steps.changes.outputs.android }}
          INSTRUMENTATION: ${{ steps.changes.outputs.instrumentation }}
          MINIFIED: ${{ steps.changes.outputs.minified }}
          SBOM: ${{ steps.changes.outputs.sbom }}
          WORKFLOWS: ${{ steps.changes.outputs.workflows }}
          VALIDATED: ${{ steps.earlier.outputs.validated }}
          # Set only when a release asks for specific suites.
          REQUESTED_SUITES: ${{ inputs.instrumentation-suites }}
        run: |
          if [ "$RUN_ALL" = "true" ]; then
            ANDROID=true INSTRUMENTATION=true MINIFIED=true SBOM=true WORKFLOWS=true
          fi
          if [ "$SCHEDULED" = "true" ]; then
            SBOM=true
          fi
          VALIDATED=${VALIDATED:-false}
          SUITES='[]'
          if [ "$INSTRUMENTATION" = "true" ]; then
            if [ -n "$REQUESTED_SUITES" ]; then
              SUITES=$REQUESTED_SUITES
            elif [ "$MINIFIED" = "true" ] && [ "$VALIDATED" != "true" ]; then
              SUITES='["debug", "minifiedSmoke"]'
            else
              SUITES='["debug"]'
            fi
          fi
          {
            echo "android=${ANDROID:-false}"
            echo "instrumentation=${INSTRUMENTATION:-false}"
            echo "suites=$SUITES"
            echo "validated=$VALIDATED"
            echo "sbom=${SBOM:-false}"
            echo "workflows=${WORKFLOWS:-false}"
          } >> "$GITHUB_OUTPUT"

  workflow-lint:
    name: Workflow Lint
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint workflows
        uses: kjanat/actionlint@08bb2c4f0d039744455b87aef1c647fb8b66d37b # v1.17.0

  quality-build:
    name: Quality & Build
    needs: changes
    if: >-
      ${{
        !contains(fromJSON(inputs.skip-jobs || '[]'), 'quality-build') &&
        needs.changes.outputs.android == 'true'
      }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          add-job-summary: "on-failure"

      - name: Run quality checks
        run: ./gradlew spotlessCheck detekt lintDebug --console=plain

      # Report build and test results even when a quality check fails.
      - name: Build debug APK and run JVM tests
        if: ${{ !cancelled() }}
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain

  instrumentation:
    name: Instrumentation (${{ matrix.suite }})
    needs: changes
    if: ${{ needs.changes.outputs.suites != '[]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.suites) }}
    env:
      # Leave room for the Android emulator and runner on private-repository VMs.
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx1g"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          add-job-summary: "on-failure"
          # A seeding-only run compiles almost nothing, so its entry must not replace the
          # full one that later pull requests restore.
          cache-read-only: ${{ needs.changes.outputs.validated == 'true' || github.ref != 'refs/heads/main' }}

      - name: Reserve disk space for the API 34 managed device
        run: |
          if [[ -d /usr/local/lib/android/sdk/ndk ]]; then
            sudo du -sh /usr/local/lib/android/sdk/ndk
            sudo rm -rf /usr/local/lib/android/sdk/ndk
          fi
          df -h /

      # Install the system image here, not in pixel6Api34Setup, so its revision can key the
      # snapshot cache below.
      - name: Install Android emulator
        id: emulator
        env:
          SYSTEM_IMAGE: system-images;android-34;aosp_atd;x86_64
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "$SYSTEM_IMAGE"
          revision() {
            python3 -I -c 'import sys, xml.etree.ElementTree as E; print(".".join(c.text for c in E.parse(sys.argv[1]).getroot().find("localPackage/revision")))' "$1"
          }
          EMULATOR=$(revision "$ANDROID_HOME/emulator/package.xml")
          IMAGE=$(revision "$ANDROID_HOME/${SYSTEM_IMAGE//;//}/package.xml")
          AGP=$(sed -n 's/^agp = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          test -n "$EMULATOR" && test -n "$IMAGE" && test -n "$AGP"
          echo "avd-cache-key=managed-avd-v1-$ImageOS-pixel6Api34-atd34r$IMAGE-emulator$EMULATOR-agp$AGP" >> "$GITHUB_OUTPUT"

      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm

      - name: Verify emulator acceleration
        run: |
          "$ANDROID_HOME/emulator/emulator" -accel-check

      # pixel6Api34Setup reuses a restored AVD and recreates its snapshot if it cannot load.
      # AGP keeps Gradle-managed AVDs in ~/.android/gradle/avd.
      - name: Restore managed device snapshot
        id: restore_managed_device
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/gradle/avd
          key: ${{ steps.emulator.outputs.avd-cache-key }}

      # A push that a pull request validated only seeds the cache: set the device up
      # when the snapshot is missing and run no tests.
      - name: Prepare managed device
        id: prepare_managed_device
        if: >-
          ${{
            needs.changes.outputs.validated != 'true' ||
            steps.restore_managed_device.outputs.cache-hit != 'true'
          }}
        timeout-minutes: 5
        run: >-
          ./gradlew pixel6Api34Setup
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --console=plain

      # TEMPORARY DIAGNOSTIC: remove before merge.
      - name: Diagnose managed device location
        run: |
          env | grep -i 'ANDROID' || true
          ls -la ~/.android ~/.android/avd ~/.android/gradle ~/.android/gradle/avd 2>&1 || true
          find ~ /root -maxdepth 6 \( -name 'pixel6Api34*' -o -name 'gradle-managed' \) 2>/dev/null || true

      # actions/cache/save only warns when its path is missing, which silently disabled
      # this cache before, so fail instead.
      - name: Require the managed device files
        if: >-
          ${{
            github.ref == 'refs/heads/main' &&
            matrix.suite == 'debug' &&
            steps.restore_managed_device.outputs.cache-hit != 'true'
          }}
        run: test -n "$(ls -A ~/.android/gradle/avd)"

      # Save before tests touch the device. Only main writes, so PRs reuse one shared entry.
      - name: Save managed device snapshot
        if: >-
          ${{
            github.ref == 'refs/heads/main' &&
            matrix.suite == 'debug' &&
            steps.restore_managed_device.outputs.cache-hit != 'true'
          }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/gradle/avd
          key: ${{ steps.emulator.outputs.avd-cache-key }}

      - name: Diagnose managed-device setup failure
        timeout-minutes: 5
        if: >-
          ${{
            failure() &&
            steps.prepare_managed_device.outcome == 'failure'
          }}
        run: >-
          ./gradlew pixel6Api34Setup
          -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --info
          --stacktrace
          --console=plain

      - name: Verify notification permission recreation
        if: ${{ matrix.suite == 'debug' && needs.changes.outputs.validated != 'true' }}
        timeout-minutes: 10
        run: >-
          ./gradlew pixel6Api34DebugAndroidTest --console=plain
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.testInstrumentationRunnerArguments.class=com.andreacovelli.whispertranscriber.NotificationPermissionRecreationInstrumentedTest

      - name: Run managed-device tests
        if: ${{ matrix.suite == 'debug' && needs.changes.outputs.validated != 'true' }}
        timeout-minutes: 10
        run: >-
          ./gradlew pixel6Api34DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --console=plain

      - name: Verify minified JSON exports
        if: ${{ matrix.suite == 'minifiedSmoke' }}
        timeout-minutes: 10
        run: >-
          ./gradlew pixel6Api34MinifiedSmokeAndroidTest --console=plain
          -PinstrumentationBuildType=minifiedSmoke
          -x lintVitalMinifiedSmoke
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.testInstrumentationRunnerArguments.class=com.andreacovelli.whispertranscriber.HistoryExportInstrumentedTest

      - name: Require minified export test results
        if: ${{ matrix.suite == 'minifiedSmoke' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = Path("app/build/outputs/androidTest-results/managedDevice/minifiedsmoke/pixel6Api34")
          cases = [case for report in reports.glob("TEST-*.xml")
                   for case in ET.parse(report).iter("testcase")
                   if case.get("classname", "").endswith(".HistoryExportInstrumentedTest")]
          if len(cases) < 4 or any(case.find(tag) is not None
                                   for case in cases for tag in ("failure", "error", "skipped")):
              raise SystemExit("All four minified export scenarios must execute and pass.")
          PY

      - name: Upload instrumentation reports on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-reports-${{ matrix.suite }}
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: warn
          retention-days: 7

  security:
    name: Security
    needs: changes
    if: ${{ !contains(fromJSON(inputs.skip-jobs || '[]'), 'security') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Push runs scan the pushed commits, pull requests scan the PR commits, and manual runs
      # scan the full history. Commit ranges need the full checkout above.
      - name: Scan new commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Set up JDK 21
        if: ${{ needs.changes.outputs.sbom == 'true' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        if: ${{ needs.changes.outputs.sbom == 'true' }}
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          add-job-summary: "on-failure"

      - name: Generate release runtime CycloneDX SBOM
        if: ${{ needs.changes.outputs.sbom == 'true' }}
        run: ./gradlew :app:cyclonedxDirectBom --console=plain

      # Grype publishes one DB a day, so a daily key lets later runs skip the download.
      # scan-action's cache-db input reuses one fixed key, which keeps the first DB forever.
      - name: Select Grype DB cache key
        if: ${{ needs.changes.outputs.sbom == 'true' }}
        id: grype_db_key
        run: echo "key=grype-db-v6-$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore Grype DB
        if: ${{ needs.changes.outputs.sbom == 'true' }}
        id: restore_grype_db
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Grype skips update checks for 2 hours after last_update_check, so never restore it.
          path: |
            ~/.cache/grype/db
            !~/.cache/grype/db/*/last_update_check
          key: ${{ steps.grype_db_key.outputs.key }}

      - name: Report release runtime SBOM vulnerabilities
        if: ${{ needs.changes.outputs.sbom == 'true' }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          # The SBOM input is mutually exclusive with a workspace path scan.
          sbom: app/build/reports/cyclonedx-release/bom.json
          output-format: table
          severity-cutoff: negligible
          only-fixed: false
          fail-build: false

      - name: Save Grype DB
        if: >-
          ${{
            needs.changes.outputs.sbom == 'true' &&
            github.ref == 'refs/heads/main' &&
            steps.restore_grype_db.outputs.cache-hit != 'true'
          }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/grype/db
            !~/.cache/grype/db/*/last_update_check
          key: ${{ steps.grype_db_key.outputs.key }}

      - name: Gate fixed high and critical release runtime vulnerabilities
        if: ${{ needs.changes.outputs.sbom == 'true' }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          # Keep Grype scoped to the release runtime dependency graph.
          sbom: app/build/reports/cyclonedx-release/bom.json
          output-format: table
          severity-cutoff: high
          only-fixed: true
          fail-build: true

      - name: Upload release SBOM
        if: >-
          ${{
            always() &&
            needs.changes.outputs.sbom == 'true'
          }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-runtime-sbom
          path: app/build/reports/cyclonedx-release/bom.json
          if-no-files-found: error
          retention-days: 14

  validate:
    name: Validate
    if: always()
    needs: [changes, workflow-lint, quality-build, instrumentation, security]
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Require every applicable verification job
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
          QUALITY_BUILD_RESULT: ${{ needs.quality-build.result }}
          INSTRUMENTATION_RESULT: ${{ needs.instrumentation.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SECURITY_REUSED: ${{ contains(fromJSON(inputs.skip-jobs || '[]'), 'security') }}
        run: |
          test "$CHANGES_RESULT" = "success"
          if [ "$SECURITY_RESULT" = "skipped" ]; then
            test "$SECURITY_REUSED" = "true"
          else
            test "$SECURITY_RESULT" = "success"
          fi
          for result in "$WORKFLOW_LINT_RESULT" "$QUALITY_BUILD_RESULT" "$INSTRUMENTATION_RESULT"; do
            test "$result" = "success" || test "$result" = "skipped"
          done
